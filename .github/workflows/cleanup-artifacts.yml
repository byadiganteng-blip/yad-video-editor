name: 🧹 Cleanup Old Artifacts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Retention days'
        required: false
        default: '7'
        type: string

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Cleanup Artifacts & Runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const days = parseInt('${{ github.event.inputs.days || 7 }}');
            const maxAge = days * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let deleted = 0;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const a of artifacts) {
              if (now - new Date(a.created_at).getTime() > maxAge) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
                  });
                  deleted++;
                } catch (e) {}
              }
            }
            console.log(`Deleted ${deleted} artifacts`);
      - uses: actions/github-script@v9
        with:
          script: |
            const days = parseInt('${{ github.event.inputs.days || 7 }}');
            const maxAge = days * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let deleted = 0;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo,
                per_page: 100, status: 'completed' }
            );
            for (const r of runs) {
              if (now - new Date(r.created_at).getTime() > maxAge && r.id !== context.runId) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, run_id: r.id
                  });
                  deleted++;
                } catch (e) {}
              }
            }
            console.log(`Deleted ${deleted} runs`);
