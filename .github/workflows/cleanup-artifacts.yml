name: Cleanup Old Artifacts

on:
  schedule:
    # Setiap hari jam 3 pagi
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Artifacts & Releases
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Delete Old Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            console.log('=== Deleting artifacts older than 1 day ===');
            
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const now = Date.now();
            const maxAge = 1 * 24 * 60 * 60 * 1000; // 1 hari
            let deleted = 0;
            
            for (const artifact of artifacts.data.artifacts) {
              const age = now - new Date(artifact.created_at).getTime();
              if (age > maxAge) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  console.log('Deleted artifact: ' + artifact.name);
                  deleted++;
                } catch (e) {
                  console.log('Failed: ' + e.message);
                }
              }
            }
            
            console.log('Total deleted: ' + deleted);
      
      - name: Delete Old Releases
        uses: actions/github-script@v7
        with:
          script: |
            console.log('=== Deleting releases older than 1 day ===');
            
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const now = Date.now();
            const maxAge = 1 * 24 * 60 * 60 * 1000; // 1 hari
            let deleted = 0;
            
            for (const release of releases.data) {
              const age = now - new Date(release.created_at).getTime();
              if (age > maxAge) {
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id
                  });
                  console.log('Deleted release: ' + release.tag_name);
                  deleted++;
                  
                  // Hapus tag juga
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: 'tags/' + release.tag_name
                    });
                  } catch (e) {
                    console.log('Tag delete failed: ' + e.message);
                  }
                } catch (e) {
                  console.log('Failed: ' + e.message);
                }
              }
            }
            
            console.log('Total deleted: ' + deleted);
      
      - name: Delete Old Workflow Runs
        uses: actions/github-script@v7
        with:
          script: |
            console.log('=== Deleting workflow runs older than 1 day ===');
            
            const workflows = ['generate-video.yml', 'build-apk.yml', 'cleanup-artifacts.yml'];
            const now = Date.now();
            const maxAge = 1 * 24 * 60 * 60 * 1000; // 1 hari
            let deleted = 0;
            
            for (const wf of workflows) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                  per_page: 100
                });
                
                for (const run of runs.data.workflow_runs) {
                  const age = now - new Date(run.created_at).getTime();
                  if (age > maxAge && run.id !== context.runId) {
                    try {
                      await github.rest.actions.deleteWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id
                      });
                      console.log('Deleted run: ' + run.id + ' (' + wf + ')');
                      deleted++;
                    } catch (e) {
                      console.log('Failed: ' + e.message);
                    }
                  }
                }
              } catch (e) {
                console.log('Workflow not found: ' + wf);
              }
            }
            
            console.log('Total deleted: ' + deleted);
