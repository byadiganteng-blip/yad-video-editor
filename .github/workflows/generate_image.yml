name: Generate AI Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Cerita lengkap'
        required: true
      voice:
        description: 'Pilihan suara'
        required: false
        default: 'male_id'
      watermark:
        description: 'Watermark (kosongkan jika tidak ada)'
        required: false
        default: ''
      show_subtitle:
        description: 'Tampilkan subtitle'
        required: false
        default: 'true'
      subtitle_style:
        description: 'neon / outline / classic / bold'
        required: false
        default: 'neon'
      scenes_count:
        description: 'Jumlah scene (4-12)'
        required: false
        default: '8'
      image_style:
        description: 'anime / realistic / cinematic / watercolor'
        required: false
        default: 'cinematic'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-noto

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          JOB_ID: ${{ github.run_id }}
          VOICE: ${{ github.event.inputs.voice }}
          WATERMARK: ${{ github.event.inputs.watermark }}
          SHOW_SUBTITLE: ${{ github.event.inputs.show_subtitle }}
          SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          SCENES_COUNT: ${{ github.event.inputs.scenes_count }}
          IMAGE_STYLE: ${{ github.event.inputs.image_style }}
        run: python generate_video.py

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ github.run_id }}
          name: Video ${{ github.run_id }}
          body: |
            Video hasil generate otomatis.
            Prompt: ${{ github.event.inputs.prompt }}
          files: |
            *.mp4
            scenes/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            *.mp4
            scenes/*.png
          if-no-files-found: ignore
          retention-days: 7
