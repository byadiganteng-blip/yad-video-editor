name: Generate AI Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Cerita lengkap'
        required: true
      voice:
        description: 'Pilihan suara'
        required: false
        default: 'male_id'
      watermark:
        description: 'Watermark'
        required: false
        default: ''
      show_subtitle:
        description: 'Tampilkan subtitle'
        required: false
        default: 'true'
      subtitle_style:
        description: 'neon / outline / classic / bold'
        required: false
        default: 'neon'
      scenes_count:
        description: 'Jumlah scene (4-12)'
        required: false
        default: '8'
      image_style:
        description: 'anime / realistic / cinematic / artistic / watercolor'
        required: false
        default: 'cinematic'
      model_id:
        description: 'ID model'
        required: false
        default: 'waifu'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-noto wget
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download Piper binary
        run: |
          mkdir -p piper_bin
          cd piper_bin
          wget -q https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          ls -la
          echo "$PWD/piper" >> $GITHUB_PATH
      - name: Generate video
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          JOB_ID: ${{ github.run_id }}
          VOICE: ${{ github.event.inputs.voice }}
          WATERMARK: ${{ github.event.inputs.watermark }}
          SHOW_SUBTITLE: ${{ github.event.inputs.show_subtitle }}
          SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          SCENES_COUNT: ${{ github.event.inputs.scenes_count }}
          IMAGE_STYLE: ${{ github.event.inputs.image_style }}
          MODEL_ID: ${{ github.event.inputs.model_id }}
        run: python generate_video.py
      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ github.run_id }}
          name: Video ${{ github.run_id }}
          body: |
            Model: ${{ github.event.inputs.model_id }}
            TTS: Piper (offline)
            Prompt: ${{ github.event.inputs.prompt }}
          files: |
            *.mp4
            scenes/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            *.mp4
            scenes/*.png
          if-no-files-found: ignore
