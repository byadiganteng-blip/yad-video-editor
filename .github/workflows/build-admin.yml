name: 👑 Build Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/app/src/admin/**'
      - 'android/app/src/main/**'
      - 'android/app/build.gradle'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

concurrency:
  group: build-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-admin:
    name: Build Admin Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3.2.1
        with: { packages: 'platform-tools' }
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.2 }
      - working-directory: android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.2 --distribution-type bin; fi
          chmod +x gradlew
      - env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/yad-release.jks
      - working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleAdminRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yad-admin-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/admin/release/*.apk
          retention-days: 14
      - if: always()
        run: rm -f android/app/yad-release.jks
