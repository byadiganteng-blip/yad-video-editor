name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-release.yml'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Verify AAR
        run: |
          ls -lh android/app/libs/
          test -f android/app/libs/ffmpeg-kit.aar || (echo "::error::AAR tidak ada" && exit 1)

      - name: Decode keystore
        run: |
          mkdir -p /home/runner/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /home/runner/keystore/yad-release.jks
          ls -lh /home/runner/keystore/yad-release.jks

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          build-root-directory: android

      - name: Ensure wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Release APK (client)
        working-directory: android
        env:
          KEYSTORE_FILE: /home/runner/keystore/yad-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleClientRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: client-release-apk-signed
          path: android/app/build/outputs/apk/client/release/*.apk
          retention-days: 30

      - name: Verify APK is signed
        run: |
          APK=$(find android/app/build/outputs/apk/client/release -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          # Cek apakah APK punya signature
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|DSA|EC)" && echo "✅ APK signed" || echo "⚠️  APK mungkin unsigned"

      - name: Cleanup keystore
        if: always()
        run: rm -rf /home/runner/keystore
