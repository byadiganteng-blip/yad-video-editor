name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Pilih target yang mau di-build'
        required: true
        default: 'both'
        type: choice
        options:
          - client
          - admin
          - both

jobs:
  build-client:
    name: Build Client APK
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_target == 'client' || github.event.inputs.build_target == 'both' }}
    defaults:
      run:
        working-directory: android
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools
      
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          build-root-directory: android
      
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x gradlew
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      
      - name: Build Client APK
        run: ./gradlew assembleClientDebug --no-daemon --stacktrace
      
      - name: Copy Client APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/client/debug -name "*.apk" -exec cp {} output/AI-TXT-to-Video-Editor-v14.apk \;
      
      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: android/output/*.apk
          if-no-files-found: error

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_target == 'admin' || github.event.inputs.build_target == 'both' }}
    defaults:
      run:
        working-directory: android
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools
      
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          build-root-directory: android
      
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x gradlew
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      
      - name: Build Admin APK
        run: ./gradlew assembleAdminDebug --no-daemon --stacktrace
      
      - name: Copy Admin APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/admin/debug -name "*.apk" -exec cp {} output/YAD-Admin-v14.apk \;
      
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: android/output/*.apk
          if-no-files-found: error
