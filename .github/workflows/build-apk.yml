name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Client APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleClientDebug --no-daemon

      - name: Build Admin APK
        working-directory: android
        run: |
          ./gradlew assembleAdminDebug --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/client/debug -name "*.apk" \
            -exec cp {} output/AI-TXT-to-Video-Editor-v13.apk \;
          find android/app/build/outputs/apk/admin/debug -name "*.apk" \
            -exec cp {} output/YAD-Admin-v13.apk \;
          ls -la output/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yad-apks-v13
          path: output/*.apk
          retention-days: 30
