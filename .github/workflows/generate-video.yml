name: Generate Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'ai_model'
        type: choice
        options: [direct, google_image, ai_model]
      style_suffix:
        description: 'Style suffix'
        required: false
        default: ''
        type: string
      model_id:
        description: 'Model ID'
        required: false
        default: ''
        type: string
      prompt:
        description: 'Cerita'
        required: true
        type: string
      voice:
        description: 'Voice (id-ID-ArdiNeural / id-ID-GadisNeural)'
        required: false
        default: 'id-ID-ArdiNeural'
        type: string
      watermark:
        description: 'Watermark'
        required: false
        default: ''
        type: string
      show_subtitle:
        description: 'Tampilkan subtitle (true/false)'
        required: false
        default: 'false'
        type: string
      subtitle_style:
        description: 'Style subtitle'
        required: false
        default: 'neon'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-noto
          pip install --quiet edge-tts requests pillow

      - name: Generate Video
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          VOICE: ${{ github.event.inputs.voice }}
          WATERMARK: ${{ github.event.inputs.watermark }}
          SHOW_SUBTITLE: ${{ github.event.inputs.show_subtitle }}
          SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          STYLE_SUFFIX: ${{ github.event.inputs.style_suffix }}
          MODEL_ID: ${{ github.event.inputs.model_id }}
          MODE: ${{ github.event.inputs.mode }}
          JOB_ID: ${{ github.run_id }}
        run: |
          mkdir -p output scenes
          cat > /tmp/generate.py << 'PYEOF'
          import asyncio, os, re, subprocess, requests, urllib.parse, textwrap
          from io import BytesIO
          from PIL import Image

          PROMPT = os.environ.get("PROMPT", "")
          VOICE_RAW = os.environ.get("VOICE", "id-ID-ArdiNeural")
          WATERMARK = os.environ.get("WATERMARK", "")
          SHOW_SUBTITLE = os.environ.get("SHOW_SUBTITLE", "false").lower() == "true"
          STYLE_SUFFIX = os.environ.get("STYLE_SUFFIX", "")
          MODEL_ID = os.environ.get("MODEL_ID", "")
          MODE = os.environ.get("MODE", "ai_model")
          JOB_ID = os.environ.get("JOB_ID", "0")

          # ============================================================
          #  FIX VOICE — map nama lama ke format edge-tts
          # ============================================================
          VOICE_MAP = {
              "male_id": "id-ID-ArdiNeural",
              "female_id": "id-ID-GadisNeural",
              "pria": "id-ID-ArdiNeural",
              "wanita": "id-ID-GadisNeural",
              "ardi": "id-ID-ArdiNeural",
              "gadis": "id-ID-GadisNeural",
              "id-ID-Standard-A": "id-ID-GadisNeural",
              "id-ID-Standard-B": "id-ID-ArdiNeural",
          }
          VOICE = VOICE_MAP.get(VOICE_RAW.lower(), VOICE_RAW)
          # Validasi
          VALID_VOICES = ["id-ID-ArdiNeural", "id-ID-GadisNeural"]
          if VOICE not in VALID_VOICES:
              print(f"⚠️  Voice '{VOICE_RAW}' tidak valid, pakai default")
              VOICE = "id-ID-ArdiNeural"

          print(f"=== Generate Video ===")
          print(f"Mode: {MODE}")
          print(f"Model: {MODEL_ID}")
          print(f"Voice input: {VOICE_RAW} → used: {VOICE}")
          print(f"Show subtitle: {SHOW_SUBTITLE}")

          WIDTH, HEIGHT = 1280, 720

          # ============================================================
          #  STORY ANALYZER
          # ============================================================
          MOOD_MAP = {
              "horror": ["seram","takut","hantu","gelap","teror","mengerikan","horor","mayat","darah","menakutkan"],
              "happy": ["senang","bahagia","gembira","tawa","tertawa","ceria","riang"],
              "sad": ["sedih","menangis","tangis","duka","kehilangan","pilu"],
              "action": ["kejar","lari","tembak","ledakan","perang","bertarung"],
              "romantic": ["cinta","kasih","peluk","cium","rindu","kekasih"],
              "mystery": ["misteri","rahasia","teka-teki","misterius","aneh"],
              "magic": ["sihir","ajaib","mantra","sulap","gaib","magis"],
          }
          TIME_MAP = {
              "night": ["malam","gelap","tengah malam","petang","bintang","bulan"],
              "day": ["siang","pagi","terang","matahari","cerah"],
              "sunset": ["senja","maghrib","matahari terbenam","jingga"],
          }
          LOC_MAP = {
              "house": ["rumah","kamar","dapur","ruang","pintu","jendela"],
              "forest": ["hutan","pohon","rimba"],
              "city": ["kota","jalan","gedung","sekolah","pasar"],
              "beach": ["pantai","laut","pesisir"],
              "cemetery": ["kuburan","makam","kubur"],
          }
          EFFECT_MAP = {
              "rain": ["hujan","gerimis"],
              "fog": ["kabut","berkabut","asap"],
              "fire": ["api","kebakaran"],
              "lightning": ["petir","kilat"],
              "ghost": ["hantu","arwah","setan"],
              "mirror": ["cermin","kaca","pantulan"],
              "shadow": ["bayangan","siluet"],
          }

          def analyze(text):
              lower = text.lower()
              def best(m):
                  hits = {k: sum(1 for w in v if w in lower) for k, v in m.items()}
                  mx = max(hits.values()) if hits else 0
                  return max(hits, key=hits.get) if mx > 0 else None
              return {
                  "mood": best(MOOD_MAP),
                  "time": best(TIME_MAP),
                  "loc": best(LOC_MAP),
                  "effects": [e for e, ws in EFFECT_MAP.items() if any(w in lower for w in ws)]
              }

          def build_prompt(scene_text):
              d = analyze(scene_text)
              parts = []
              # Karakter (kata kapital)
              for w in scene_text.split():
                  clean = w.strip(".,!?")
                  if len(clean) > 2 and clean[0].isupper():
                      parts.append(clean)
                      break
              # Mood
              md = {"horror":"creepy dark","happy":"joyful bright","sad":"melancholic",
                    "action":"dynamic action","romantic":"romantic soft","mystery":"mysterious",
                    "magic":"magical glowing"}
              if d["mood"]: parts.append(md.get(d["mood"], "atmospheric"))
              # Time
              td = {"night":"night moonlight","day":"daytime sunlight","sunset":"golden hour"}
              if d["time"]: parts.append(td.get(d["time"], "daytime"))
              # Location
              ld = {"house":"cozy room","forest":"dense forest","city":"city street",
                    "beach":"beach","cemetery":"graveyard"}
              if d["loc"]: parts.append(ld.get(d["loc"], ""))
              # Effects
              ed = {"rain":"rainy","fog":"foggy","fire":"fire","lightning":"lightning",
                    "ghost":"ghostly","mirror":"mirror reflection","shadow":"shadows"}
              for e in d["effects"]:
                  if e in ed: parts.append(ed[e])
              # Style
              if STYLE_SUFFIX: parts.append(STYLE_SUFFIX)

              prompt = ", ".join(p for p in parts if p)

              # SANITASI: batasi panjang + buang karakter aneh
              prompt = re.sub(r'[^\w\s,\-]', '', prompt)
              if len(prompt) > 180:
                  prompt = prompt[:180].rsplit(",", 1)[0]
              return prompt

          # Split scenes
          sents = [s.strip() for s in PROMPT.replace("!", ".").replace("?", ".").split(".") if s.strip()]
          if not sents: sents = [PROMPT]
          SCENES = min(6, len(sents))
          if len(sents) > SCENES:
              step = len(sents) / SCENES
              scenes = [sents[int(i*step)] for i in range(SCENES)]
          else:
              scenes = sents

          print(f"Scenes: {len(scenes)}")

          # ============================================================
          #  GENERATE IMAGES — dengan retry + fallback
          # ============================================================
          def gen_image(scene_text, idx):
              prompt = build_prompt(scene_text)
              print(f"\n  Scene {idx+1}: {prompt}")
              
              # Coba 3x
              for attempt in range(3):
                  try:
                      encoded = urllib.parse.quote(prompt)
                      seed = (int(JOB_ID) + idx * 100 + attempt) % 100000
                      url = f"https://image.pollinations.ai/prompt/{encoded}?width={WIDTH}&height={HEIGHT}&nologo=true&seed={seed}"
                      
                      r = requests.get(url, timeout=60)
                      if r.status_code == 200 and len(r.content) > 1000:
                          img = Image.open(BytesIO(r.content)).convert("RGB").resize((WIDTH, HEIGHT), Image.LANCZOS)
                          out = f"scenes/scene_{idx:02d}.png"
                          img.save(out)
                          print(f"    ✅ OK (attempt {attempt+1})")
                          return out
                      print(f"    ⚠️ HTTP {r.status_code}, retry...")
                  except Exception as e:
                      print(f"    ⚠️ {e}, retry...")
                  
                  import time
                  time.sleep(3)
              
              # Fallback: solid gradient
              print(f"    ❌ Gagal, pakai solid")
              img = Image.new("RGB", (WIDTH, HEIGHT), (30, 58, 138))
              out = f"scenes/scene_{idx:02d}.png"
              img.save(out)
              return out

          print("\n=== Generate Images ===")
          scene_imgs = [gen_image(s, i) for i, s in enumerate(scenes)]

          # ============================================================
          #  TTS
          # ============================================================
          print(f"\n=== TTS (voice={VOICE}) ===")
          async def gen_tts():
              import edge_tts
              c = edge_tts.Communicate(PROMPT, VOICE)
              await c.save("output/narration.mp3")
          asyncio.run(gen_tts())
          print("TTS OK")

          # ============================================================
          #  RENDER
          # ============================================================
          print("\n=== Render ===")
          audio_dur = float(subprocess.check_output(
              ["ffprobe","-v","error","-show_entries","format=duration",
               "-of","default=noprint_wrappers=1:nokey=1","output/narration.mp3"]
          ).decode().strip())
          per_scene = audio_dur / len(scene_imgs)
          print(f"Audio {audio_dur:.1f}s, per scene {per_scene:.1f}s")

          with open("scenes/concat.txt", "w") as f:
              for img in scene_imgs:
                  f.write(f"file '{os.path.basename(img)}'\n")
                  f.write(f"duration {per_scene}\n")
              f.write(f"file '{os.path.basename(scene_imgs[-1])}'\n")

          subprocess.run([
              "ffmpeg","-y","-f","concat","-safe","0",
              "-i","scenes/concat.txt","-vsync","vfr",
              "-vf",f"scale={WIDTH}:{HEIGHT},format=yuv420p",
              "-c:v","libx264","-t",str(audio_dur),
              "output/video_noaudio.mp4"
          ], check=True)

          video_input = "output/video_noaudio.mp4"
          if SHOW_SUBTITLE:
              print("Adding subtitle...")
              lines = textwrap.wrap(PROMPT, width=40)
              sub_text = " ".join(lines[:3]).replace(":", "\\:").replace("'", "")
              subprocess.run([
                  "ffmpeg","-y","-i","output/video_noaudio.mp4",
                  "-vf",f"drawtext=text='{sub_text}':fontcolor=white:fontsize=36:"
                        f"x=(w-text_w)/2:y=h-100:box=1:boxcolor=black@0.5:boxborderw=10",
                  "-c:v","libx264","-pix_fmt","yuv420p",
                  "output/video_withsub.mp4"
              ], check=True)
              video_input = "output/video_withsub.mp4"
          else:
              print("Skipping subtitle")

          subprocess.run([
              "ffmpeg","-y","-i",video_input,"-i","output/narration.mp3",
              "-c:v","copy","-c:a","aac","-shortest",
              "output/final_video.mp4"
          ], check=True)

          if WATERMARK:
              safe_wm = WATERMARK.replace(":", "\\:").replace("'", "")
              subprocess.run([
                  "ffmpeg","-y","-i","output/final_video.mp4",
                  "-vf",f"drawtext=text='{safe_wm}':fontcolor=white@0.5:fontsize=24:"
                        f"x=w-text_w-20:y=h-text_h-20",
                  "-c:a","copy","output/final_video_wm.mp4"
              ], check=True)
              os.replace("output/final_video_wm.mp4", "output/final_video.mp4")

          print(f"\n=== DONE ===")
          print(f"Size: {os.path.getsize('output/final_video.mp4')} bytes")
          PYEOF
          python3 /tmp/generate.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: output/final_video.mp4
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'generate-video.yml', per_page: 100
            });
            const now = Date.now(); const maxAge = 24*60*60*1000;
            for (const run of runs.data.workflow_runs) {
              const age = now - new Date(run.created_at).getTime();
              if (age > maxAge && run.id !== context.runId) {
                try { await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
                }); } catch (e) {}
              }
            }
