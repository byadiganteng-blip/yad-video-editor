name: _TMP Generate SHA-1

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/yad-release.jks
          ls -lh /tmp/yad-release.jks

      - name: Print keystore info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "===== BEGIN KEYSTORE INFO ====="
          keytool -list -v \
            -keystore /tmp/yad-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /tmp/keystore_info.txt 2>&1
          cat /tmp/keystore_info.txt
          echo "===== END KEYSTORE INFO ====="

      - name: Cleanup
        if: always()
        run: rm -f /tmp/yad-release.jks /tmp/keystore_info.txt
