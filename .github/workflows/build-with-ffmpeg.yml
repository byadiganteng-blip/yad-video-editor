name: 🎬 Build Client with FFmpeg

on:
  push:
    branches: [ main ]
    paths:
      - 'android/app/libs/**'
      - 'android/app/build.gradle'
  workflow_dispatch:

concurrency:
  group: build-ffmpeg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ffmpeg:
    name: Build with FFmpeg Kit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4.0.1
        with: { packages: 'platform-tools' }
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          ls -lh android/app/libs/ || true
          test -f android/app/libs/ffmpeg-kit.aar || echo "::warning::AAR tidak ada"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.2 }
      - working-directory: android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.2 --distribution-type bin; fi
          chmod +x gradlew
      - env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/yad-release.jks
      - working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleClientRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yad-ffmpeg-${{ github.run_number }}
          path: android/app/build/outputs/apk/client/release/*.apk
          retention-days: 14
      - if: always()
        run: rm -f android/app/yad-release.jks
