name: Build APK with FFmpeg

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-aar:
    name: Check AAR Exists
    runs-on: ubuntu-24.04
    outputs:
      aar_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        run: |
          if [ -f "android/app/libs/ffmpeg-kit.aar" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-ffmpeg-aar:
    name: Build FFmpeg-Kit AAR
    needs: check-aar
    if: needs.check-aar.outputs.aar_exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 cmake;3.22.1'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config cmake nasm yasm wget unzip git build-essential texinfo gperf python3 python-is-python3
      - run: |
          git clone --depth 1 https://github.com/Javernaut/ffmpeg-kit.git ffmpeg-kit-src || \
          git clone --depth 1 https://github.com/arthenica/ffmpeg-kit.git ffmpeg-kit-src
      - env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: |
          cd ffmpeg-kit-src
          chmod +x android.sh
          ./android.sh --lts --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64 --enable-android-media-codec --enable-android-zlib
      - run: |
          AAR=$(find ffmpeg-kit-src -name "*.aar" -type f -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          mkdir -p android/app/libs
          cp "$AAR" android/app/libs/ffmpeg-kit.aar
          ls -lh android/app/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-aar
          path: android/app/libs/ffmpeg-kit.aar
          retention-days: 90
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/libs/ffmpeg-kit.aar
          git diff --cached --quiet || (git commit -m "chore: update ffmpeg-kit AAR [skip ci]" && git push)

  build-client-apk:
    name: Build Client APK
    needs: [check-aar, build-ffmpeg-aar]
    if: |
      always() && 
      (needs.build-ffmpeg-aar.result == 'success' || needs.build-ffmpeg-aar.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          ls -lh android/app/libs/
          test -f android/app/libs/ffmpeg-kit.aar || (echo "::error::AAR tidak ada" && exit 1)
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          build-root-directory: android
      - working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x gradlew
      - working-directory: android
        run: ./gradlew assembleClientDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: client-debug-apk
          path: android/app/build/outputs/apk/client/debug/*.apk
          retention-days: 30
