name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-client-release:
    runs-on: ubuntu-latest
    name: Build Client Release APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/yad-release.jks
          ls -lh android/app/yad-release.jks

      - name: Verify FFmpeg AAR
        run: |
          ls -lh android/app/libs/ || true
          test -f android/app/libs/ffmpeg-kit.aar || echo "::warning::AAR tidak ada"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Make gradlew executable
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Client Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleClientRelease --no-daemon --stacktrace

      - name: Cleanup Keystore
        if: always()
        run: rm -f android/app/yad-release.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yad-video-editor-client-release
          path: android/app/build/outputs/apk/client/release/*.apk
          if-no-files-found: warn
          retention-days: 30
