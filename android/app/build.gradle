plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.yad.videoeditor'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "13.0.0"
        multiDexEnabled true

        buildConfigField "String", "GH_TOKEN", "\"\""
        buildConfigField "String", "ADMIN_EMAIL", "\"ynuraini686@gmail.com\""
        buildConfigField "String", "ADMIN_PASS", "\"YADIGANTENG\""
    }

    flavorDimensions "version"
    productFlavors {
        client {
            dimension "version"
            applicationId "com.yad.videoeditor"
            versionNameSuffix "-client"
            resValue "string", "app_name", "AI TXT to Video + Editor"
            buildConfigField "boolean", "IS_ADMIN_APP", "false"
        }
        admin {
            dimension "version"
            applicationId "com.yad.videoeditor.admin"
            versionNameSuffix "-admin"
            resValue "string", "app_name", "YAD Admin"
            buildConfigField "boolean", "IS_ADMIN_APP", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Firebase Firestore + Auth
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
