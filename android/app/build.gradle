plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yad.videoeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.yad.videoeditor"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    // FLAVOR: client & admin
    flavorDimensions "app"
    productFlavors {
        client {
            dimension "app"
            applicationId "com.yad.videoeditor"
            versionNameSuffix "-client"
        }
        admin {
            dimension "app"
            applicationId "com.yad.videoeditor.admin"
            versionNameSuffix "-admin"
        }
    }


    // ✅ Signing config supaya bisa update dari versi lama
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

                storeFile file(keystoreProperties['storeFile'] ?: "yad-release.jks")
                storePassword keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD")
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS")
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
            } else {
                // Fallback dari environment variables (GitHub Secrets)
                storeFile file("yad-release.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Media
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.5.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:22.5.0'
    implementation 'com.startapp:inapp-sdk:4.10.12'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
